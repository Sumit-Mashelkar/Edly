services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peblo}
      POSTGRES_USER: ${POSTGRES_USER:-peblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://peblo:peblo@db:5432/peblo}
    ports:
      - "8000:8000"
    depends_on:
      - db

  cms:
    build: ./cms
    ports:
      - "5173:5173"

  viewer:
    build: ./viewer
    ports:
      - "5174:5174"

volumes:
  postgres_data:
