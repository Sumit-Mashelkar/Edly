name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build CMS
        run: |
          cd cms
          npm ci
          npm run build

      - name: Build Viewer
        run: |
          cd viewer
          npm ci
          npm run build

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t peblo-backend:ci .

      - name: Build CMS Docker image
        run: docker build -f cms/Dockerfile -t peblo-cms:ci ./cms

      - name: Build Viewer Docker image
        run: docker build -f viewer/Dockerfile -t peblo-viewer:ci ./viewer
