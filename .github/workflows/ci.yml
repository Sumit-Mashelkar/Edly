name: CI

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project structure
        run: |
          test -f backend/app/main.py
          test -f cms/package.json
          test -f viewer/package.json
          test -f seed/reference.json
          test -f seed/seed_shows.json
